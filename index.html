<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERIX — AI Agent Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #060d1f; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  .phone { width: 420px; max-width: 100%; height: 760px; max-height: 92vh; background: #0a1428; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #1e3a6e; box-shadow: 0 0 60px rgba(26,115,232,0.35); }
  .header { background: linear-gradient(135deg, #0b3d91, #1a73e8); padding: 18px; display: flex; align-items: center; gap: 14px; color: #fff; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #00d4ff, #1a73e8); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; border: 2px solid #fff; }
  .header h2 { font-size: 20px; letter-spacing: 2px; }
  .header p { font-size: 12px; opacity: 0.85; display: flex; align-items: center; gap: 6px; }
  .online { width: 9px; height: 9px; border-radius: 50%; background: #4ade80; display: inline-block; }
  .demo-tag { margin-left: auto; font-size: 10px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 20px; letter-spacing: 1px; }
  .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: radial-gradient(circle at 50% 0%, rgba(26,115,232,0.12), transparent 60%); }
  .msg { max-width: 82%; padding: 12px 16px; border-radius: 18px; font-size: 14.5px; line-height: 1.55; animation: pop 0.25s ease; white-space: pre-line; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .bot { background: #14264a; color: #e8f1ff; border-bottom-left-radius: 6px; align-self: flex-start; border: 1px solid #1e3a6e; }
  .user { background: linear-gradient(135deg, #1a73e8, #0b3d91); color: #fff; border-bottom-right-radius: 6px; align-self: flex-end; }
  .typing { display: flex; gap: 5px; padding: 14px 18px; }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: #5aa2ff; animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; } .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
  .chips { display: flex; gap: 8px; padding: 10px 14px; flex-wrap: wrap; background: #0a1428; border-top: 1px solid #1e3a6e; }
  .chip { background: #14264a; color: #7db8ff; border: 1px solid #2a5cb8; padding: 8px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: 0.2s; }
  .chip:hover { background: #1a73e8; color: #fff; }
  .inputbar { display: flex; gap: 10px; padding: 12px 14px; background: #0a1428; }
  .inputbar input { flex: 1; background: #14264a; border: 1px solid #1e3a6e; border-radius: 24px; padding: 12px 18px; color: #fff; font-size: 14px; outline: none; }
  .inputbar input::placeholder { color: #5a7bb8; }
  .inputbar button { width: 48px; height: 48px; border-radius: 50%; border: none; background: linear-gradient(135deg, #1a73e8, #0b3d91); color: #fff; font-size: 20px; cursor: pointer; }
  .tagline { text-align: center; font-size: 11px; color: #5a7bb8; padding: 8px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="avatar">A</div>
    <div><h2>AERIX</h2><p><span class="online"></span> online — turant jawab</p></div>
    <div class="demo-tag">DEMO</div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="chips" id="chips"></div>
  <div class="inputbar">
    <input id="inp" type="text" placeholder="Kuch puchho..." autocomplete="off">
    <button onclick="sendUser()">➤</button>
  </div>
  <div class="tagline">YOUR BUSINESS, ON AUTOPILOT ✦ Kaam Automatic, Growth Fantastic</div>
</div>
<script>
const chat = document.getElementById('chat');
const chipsBox = document.getElementById('chips');
const inp = document.getElementById('inp');

const CHIPS = ["Services kya hain?", "Price kitna hai?", "Order kaise karun?", "Automation me kya milta hai?", "Contact number?"];

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function showTyping() {
  const d = document.createElement('div');
  d.className = 'msg bot typing'; d.id = 'typing';
  d.innerHTML = '<span></span><span></span><span></span>';
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
}
function hideTyping() { document.getElementById('typing')?.remove(); }

function brain(q) {
  q = q.toLowerCase();
  if (/(namaste|hello|hi\b|hey|salaam|ram ram)/.test(q))
    return "Namaste! 🙏 Main AERIX hun — aapka AI assistant!\n\nAERIX Creative, Design aur Automation — teeno ke baare me kuch bhi puchho, main turant jawab dunga! 😊";
  if (/(service|kya karte|kaam kya|services)/.test(q))
    return "AERIX ki services ye hain:\n\n🎨 DESIGN:\n• Posters\n• Product Ads\n• Branding\n\n🎬 CREATIVE:\n• Video Editing\n• Drone Shoots 🚁\n• Digital Marketing\n• Paid Promotions\n• Event Coverage\n\n🤖 AUTOMATION:\n• WhatsApp Auto-Reply\n• Smart Order System\n• Stock Alert\n• Profit Reports\n\nKisi service ke baare me detail chahiye to naam likho! 😊";
  if (/(price|rate|kitna|paisa|cost|charge|fees|daam)/.test(q))
    return "Price kaam dekh ke baat karke tay hoti hai — har project alag hota hai! 💰\n\nBest rahega seedha baat kar lo:\n📞 83202 03560\n\nBatao, kaunsa kaam karwana hai? Us hisaab se sahi price bata dunga! 😊";
  if (/(contact|number|phone|mobile|call|sampark)/.test(q))
    return "Humse contact karo:\n\n📞 83202 03560 (AK)\n📞 73593 54076\n\nWhatsApp par message karo — turant reply milega! 📩";
  if (/(order|kaise karun|book|kaam dena)/.test(q))
    return "Order karna bahut aasaan hai! 👇\n\n1️⃣ WhatsApp karo: 83202 03560\n2️⃣ Apna kaam batao (poster? video? automation?)\n3️⃣ Price baat karke tay hogi\n4️⃣ Kaam shuru! 🚀\n\nDer kis baat ki? Abhi message karo! 😊";
  if (/(automation|auto|whatsapp.*reply|jarvis)/.test(q))
    return "🤖 AERIX AUTOMATION — aapka business autopilot par!\n\n• 💬 WhatsApp Auto-Reply — customer ko turant jawab\n• 🛒 Smart Order System — order se bill tak automatic\n• 🔔 Stock Alert — maal khatm hone se pehle khabar\n• 📊 Profit Reports — mahine ki kamai automatic\n\n*Kaam Automatic, Growth Fantastic!* ✨\n\nDemo dekhna hai? WhatsApp karo: 83202 03560";
  if (/(poster)/.test(q))
    return "🎨 Poster design hamari speciality hai!\n\nDukaan, event, tournament, product — har tarah ke cinematic posters banate hain!\n\nSamples dekhne ke liye Instagram dekho: @aerix_design 📸\n\nOrder ke liye WhatsApp: 83202 03560";
  if (/(video|shoot|drone)/.test(q))
    return "🎬 Video services:\n\n• Professional Video Editing\n• Cinematic Drone Shoots 🚁\n• Event Coverage\n\nKaam dekho: @aerixcreativeofficial 📸\n\nBooking ke liye: 83202 03560";
  if (/(brand)/.test(q))
    return "✨ Branding me hum karte hain:\n\n• Logo design\n• Brand identity\n• Product branding\n\n*Design jo sirf dikhe nahi, BIKE!* 💪\n\nBaat karo: 83202 03560";
  if (/(time|kitna.*din|kab.*milega|delivery)/.test(q))
    return "Time kaam par depend karta hai — chhota poster 1-2 din, bada project baat karke! ⏱️\n\nExact time ke liye WhatsApp karo: 83202 03560";
  if (/(thank|shukriya|dhanyavad|acha|mast|badhiya|great)/.test(q))
    return "Bahut shukriya! 😊🙏\n\nAur kuch puchhna ho to main yahin hun — 24x7! Kuch aur jaanna hai?";
  if (/(bye|alvida|phir milenge)/.test(q))
    return "Phir milenge! 👋 AERIX hamesha aapki seva me! Koi kaam ho to 83202 03560 par WhatsApp karna! 😊";
  return "Hmm, ye samajh nahi aaya! 🤔\n\nMain inme help kar sakta hun:\n• Services ki jaankari\n• Price ki baat\n• Order kaise karein\n• Contact numbers\n\nNeeche buttons dabao ya apna sawal likho! 👇";
}

function botReply(q) {
  showTyping();
  setTimeout(() => { hideTyping(); addMsg(brain(q), 'bot'); }, 700 + Math.random() * 600);
}
function sendUser(text) {
  const v = (text ?? inp.value).trim();
  if (!v) return;
  addMsg(v, 'user'); inp.value = '';
  botReply(v);
}
inp.addEventListener('keydown', e => { if (e.key === 'Enter') sendUser(); });

CHIPS.forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = c;
  b.onclick = () => sendUser(c);
  chipsBox.appendChild(b);
});

setTimeout(() => addMsg("Namaste! 🙏 Main **AERIX** hun!\n\nAapke business ke liye — Posters, Videos, Branding aur AI Automation!\n\nKya jaanna chahenge? Neeche button dabao ya likh ke puchho! 😊", 'bot'), 500);
</script>
</body>
</html>
